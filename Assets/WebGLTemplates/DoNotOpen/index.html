<!doctype html>
<!-- inventory-layout-farm6 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172219">
  <meta name="description" content="种植建造像素游戏">
  <title>Raft Survival · 海上生存</title>
  <style>
    @font-face {
      font-family: "Ark Pixel Web";
      src: url("Fonts/ark-pixel-12px-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2190-21FF;
      font-display: swap;
    }

    @font-face {
      font-family: "Ark Pixel Web";
      src: url("Fonts/ark-pixel-12px-zh_cn.woff2") format("woff2");
      unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --ink: #fff3bf;
      --muted: #d8e8c2;
      --panel: rgba(27, 43, 29, 0.94);
      --line: #a9d86e;
      --accent: #f2d36f;
      --shadow: #142118;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #172219;
      color: var(--ink);
      font-family: "Ark Pixel Web", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font: inherit;
    }

    #game-shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #263529;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #263529;
      outline: none;
      image-rendering: pixelated;
    }

    #menu,
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    #menu {
      z-index: 6;
      background: linear-gradient(to bottom, #6cc3ea 0%, #c3efff 56%, #8bd47e 56%, #6abe5c 100%);
      align-items: center;
      padding-top: 24px;
      padding-bottom: 24px;
      transition: opacity 180ms steps(3, end);
    }

    #menu::before {
      position: absolute;
      top: 8%;
      left: 10%;
      width: 84px;
      height: 24px;
      content: "";
      background: #ffffff;
      box-shadow:
        12px -12px 0 #ffffff,
        24px -12px 0 #ffffff,
        36px 0 0 #ffffff,
        48px 0 0 #ffffff,
        60px 12px 0 #ffffff;
      opacity: 0.86;
    }

    #menu::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 0;
      height: 38%;
      content: "";
      background: #62c457;
      box-shadow: inset 0 6px 0 rgba(31, 120, 49, 0.32), inset 0 12px 0 rgba(137, 220, 113, 0.35);
    }

    .menu-scene {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 1;
      height: 38%;
      overflow: hidden;
      pointer-events: none;
      background: url("grass-preview.png") repeat;
      background-size: 12px 12px;
      animation: grass-scroll 2.4s steps(12, end) infinite;
    }

    .menu-cloud {
      position: absolute;
      z-index: 0;
      width: 92px;
      height: 20px;
      background: #ffffff;
      box-shadow: 12px -10px 0 #ffffff, 24px -10px 0 #ffffff, 36px 0 0 #ffffff;
      opacity: 0.72;
      pointer-events: none;
    }

    .menu-cloud.cloud-two { top: 23%; right: 13%; transform: scale(0.72); }

    @keyframes grass-scroll {
      from { background-position: 0 0; }
      to { background-position: -96px 0; }
    }

    .menu-character {
      position: absolute;
      bottom: 14%;
      left: 50%;
      width: 48px;
      height: 62px;
      image-rendering: pixelated;
      transform-origin: center bottom;
      transform: translateX(-50%);
      animation: menu-player-motion 420ms ease-in-out infinite;
    }

    .menu-player {
      position: absolute;
      bottom: 7px;
      left: 0;
      width: 48px;
      height: 48px;
      background: url("player-preview.png") center / 48px 48px no-repeat;
      image-rendering: pixelated;
    }

    @keyframes menu-player-motion {
      0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      25% { transform: translateX(-50%) translateY(-3px) rotate(3deg); }
      50% { transform: translateX(-50%) translateY(-6px) rotate(0deg); }
      75% { transform: translateX(-50%) translateY(-3px) rotate(-3deg); }
      100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    }

    #menu.hidden {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
    }

    #world-select {
      position: absolute;
      inset: 0;
      z-index: 16;
      display: none;
      place-items: center;
      padding: 24px;
      background: #1d2c20;
    }

    #world-select.visible {
      display: grid;
    }

    .world-select-card {
      display: grid;
      width: min(720px, 94vw);
      gap: 16px;
      border: 5px solid #b0a77c;
      padding: 30px;
      background: #3c3c3c;
      box-shadow: inset 0 0 0 4px #191919, 0 8px 0 #151515;
    }

    .world-select-title {
      color: #fff2a8;
      font-size: 32px;
      text-align: center;
    }

    .world-select-subtitle {
      color: #d9dfc7;
      font-size: 15px;
      text-align: center;
    }

    #world-list {
      display: grid;
      gap: 10px;
      margin: 6px 0;
    }

    #world-empty-notice {
      display: none;
      min-height: 22px;
      color: #d0d0d0;
      font-size: 15px;
      text-align: center;
    }

    #world-empty-notice.visible {
      display: block;
    }

    #world-list-view {
      display: grid;
      gap: 16px;
    }

    #world-create-view {
      display: none;
      gap: 16px;
    }

    #world-create-view.visible {
      display: grid;
    }

    .world-field {
      display: grid;
      gap: 6px;
      color: #fff2a8;
      font-size: 16px;
    }

    .world-field input {
      border: 3px solid #1b1b1b;
      padding: 10px;
      background: #777777;
      color: #ffffff;
      font: inherit;
      font-size: 17px;
      outline: none;
    }

    .world-field input:focus {
      border-color: var(--accent);
    }

    .world-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      border: 3px solid #1b1b1b;
      padding: 12px 14px;
      background: #5a5a5a;
    }

    .world-card.empty {
      background: #484848;
    }

    .world-card-copy {
      display: grid;
      gap: 4px;
    }

    .world-card-copy strong {
      color: #fff2a8;
      font-size: 19px;
      font-weight: normal;
    }

    .world-card-copy small {
      color: #d0d0d0;
      font-size: 13px;
    }

    .world-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .world-card-button,
    .world-action-button {
      min-height: 42px;
      border: 3px solid #19351f;
      padding: 8px 14px 6px;
      background: var(--accent);
      color: #20321f;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    .world-card-button:hover,
    .world-action-button:hover {
      background: #ffe994;
    }

    .world-card-button.delete {
      border-color: #401d1d;
      background: #9b5c5c;
      color: #ffffff;
    }

    .world-card-button.delete:hover {
      background: #c97970;
    }

    .world-action-button.secondary {
      background: #777777;
      color: #ffffff;
    }

    .world-select-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    #world-select-notice {
      min-height: 22px;
      color: #ffd5c7;
      font-size: 14px;
      text-align: center;
    }

    .menu-card {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(560px, 92vw);
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 24px;
      text-align: center;
    }

    .menu-kicker {
      margin-bottom: 14px;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.18em;
    }

    .menu-card h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(38px, 8vw, 68px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.08em;
      text-shadow: 4px 4px 0 #25492a;
    }

    .title-motion {
      transform-origin: center top;
      animation: title-drop 2.1s cubic-bezier(0.16, 1, 0.3, 1.18) 0.85s both;
    }

    .title-motion h1 {
      transform-origin: center bottom;
      animation: title-sway 3.8s ease-in-out 2.75s infinite;
    }

    @keyframes title-drop {
      /* Keep the title upright and still while it falls; only the vertical
         landing bounce moves it.  The gentle sway starts after this animation. */
      0% { opacity: 0; transform: translateY(-70vh) rotate(0deg) scale(1); }
      48% { opacity: 1; transform: translateY(30px) rotate(0deg) scale(1); }
      64% { transform: translateY(-15px) rotate(0deg) scale(1); }
      78% { transform: translateY(8px) rotate(0deg) scale(1); }
      90% { transform: translateY(-4px) rotate(0deg) scale(1); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes title-sway {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(2.5deg) scale(1.05); }
      50% { transform: rotate(0deg) scale(1); }
      75% { transform: rotate(-2.5deg) scale(1.05); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .menu-subtitle {
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: 18px;
      letter-spacing: 0.26em;
    }

    .menu-description {
      max-width: 360px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: 0.04em;
    }

    .menu-tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 24px;
    }

    .menu-tag {
      border: 2px solid rgba(169, 216, 110, 0.48);
      padding: 6px 10px 4px;
      color: #e3efbd;
      background: rgba(62, 107, 57, 0.55);
      font-size: 12px;
    }

    .pixel-button {
      min-width: 210px;
      border: 3px solid #19351f;
      padding: 13px 28px 11px;
      background: var(--accent);
      color: #20321f;
      font-size: 22px;
      cursor: pointer;
      box-shadow:
        0 5px 0 #876f30,
        inset 0 0 0 2px rgba(255, 251, 194, 0.62);
    }

    .pixel-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 7px 0 #876f30,
        inset 0 0 0 2px rgba(255, 251, 194, 0.62);
    }

    .pixel-button:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 #876f30,
        inset 0 0 0 2px rgba(255, 251, 194, 0.62);
    }

    .controls {
      margin-top: 22px;
      color: #d7e8c2;
      font-size: 13px;
      line-height: 1.8;
    }

    .menu-tip {
      margin-top: 12px;
      color: #9fbd8c;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    #unity-splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #172219;
      color: #ffffff;
      pointer-events: none;
      animation: unity-splash-hide 360ms steps(4, end) 1.05s forwards;
    }

    .unity-splash-content {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .unity-mark {
      position: relative;
      width: 58px;
      height: 58px;
      border: 7px solid #ffffff;
      transform: rotate(45deg);
      box-shadow: inset 0 0 0 5px #172219;
    }

    .unity-mark::before,
    .unity-mark::after {
      position: absolute;
      content: "";
      background: #172219;
    }

    .unity-mark::before {
      top: 19px;
      left: -11px;
      width: 66px;
      height: 7px;
    }

    .unity-mark::after {
      top: -11px;
      left: 19px;
      width: 7px;
      height: 66px;
    }

    .unity-word {
      font-size: 20px;
      letter-spacing: 0.24em;
    }

    @keyframes unity-splash-hide {
      to { visibility: hidden; opacity: 0; }
    }

    #loading {
      z-index: 5;
      visibility: hidden;
      gap: 14px;
      align-content: center;
      background: #1d2c20;
      text-align: center;
      opacity: 0;
      transition: opacity 180ms steps(3, end);
    }

    #loading.active {
      visibility: visible;
      opacity: 1;
    }

    #loading.done {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
    }

    .loading-title {
      font-size: 26px;
      letter-spacing: 0.14em;
    }

    .track {
      overflow: hidden;
      width: min(330px, 72vw);
      height: 10px;
      border: 3px solid #101b13;
      background: #344d36;
    }

    #progress {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 100ms steps(10, end);
    }

    #status {
      color: var(--muted);
      font-size: 13px;
    }

    #coin-display {
      position: absolute;
      top: 28px;
      right: 18px;
      z-index: 5;
      display: none;
      min-width: 0;
      min-height: 36px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--accent);
      font-size: 21px;
      line-height: 34px;
      text-align: center;
      text-shadow: 2px 2px 0 #172219;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    #coin-display.visible {
      display: flex;
    }

    .coin-sprite {
      display: inline-block;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      background-image: url("shop-materials.png");
      background-repeat: no-repeat;
      background-size: 800% 400%;
      background-position: 85.7143% 0% !important;
      image-rendering: pixelated;
      vertical-align: middle;
    }

    .coin-small {
      width: 22px;
      height: 22px;
      flex-basis: 22px;
      background-size: 800% 400%;
    }

    #coin-display > .coin-sprite {
      transform: translateY(2px);
    }

    .coin-label,
    .coin-separator {
      line-height: 34px;
    }

    .price {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #38552f;
    }

    #hotkey-hud,
    #hotkey-feedback {
      position: absolute;
      z-index: 5;
      display: none;
      color: var(--muted);
      font-size: 14px;
      text-shadow: 2px 2px 0 #172219;
      pointer-events: none;
    }

    #hotkey-hud {
      bottom: 18px;
      left: 18px;
    }

    #hotkey-feedback {
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--accent);
      font-size: 18px;
    }

    #hotkey-hud.visible,
    #hotkey-feedback.visible {
      display: block;
    }

    /* 操作反馈改为不显示，避免中上方出现黄色提示文字。 */
    #hotkey-feedback,
    #hotkey-feedback.visible {
      display: none !important;
    }

    #utility-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 10;
      display: none;
      width: min(860px, calc(100vw - 48px));
      min-height: 480px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      transform: translate(-50%, -50%);
      border: 5px solid #b0a77c;
      padding: 24px;
      background: #3c3c3c;
      box-shadow: inset 0 0 0 4px #191919, 0 8px 0 #151515;
      color: var(--muted);
      text-align: center;
    }

    #utility-panel.visible {
      display: block;
    }

    #utility-panel.shop-screen {
      top: 0;
      left: 0;
      z-index: 20;
      display: block;
      width: 100vw;
      min-height: 100vh;
      max-height: none;
      overflow-y: auto;
      transform: translateX(-100%);
      border: 0;
      padding: clamp(28px, 6vh, 72px) clamp(22px, 8vw, 120px);
      background: rgba(27, 43, 29, 0.98);
      box-shadow: none;
      text-align: left;
      transition: transform 360ms cubic-bezier(0.22, 0.8, 0.28, 1);
    }

    #utility-panel.shop-screen.visible {
      transform: translateX(0);
    }

    #utility-panel.shop-screen #utility-title-row {
      max-width: 1100px;
      margin: 0 auto 28px;
      padding: 0;
    }

    #utility-panel.shop-screen #shop-view {
      max-width: 1100px;
      margin: 0 auto;
    }

    #utility-panel.shop-screen #sell-view {
      max-width: 1100px;
      margin: 0 auto;
    }

    #utility-panel.shop-screen .shop-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    #shop-toggle {
      position: absolute;
      top: 50%;
      left: 10px;
      z-index: 7;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      min-height: 50px;
      transform: translateY(-50%);
      border: 3px solid #19351f;
      padding: 10px 14px 8px;
      background: var(--accent);
      color: #20321f;
      font: inherit;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 4px 4px 0 rgba(20, 33, 24, 0.72);
    }

    #shop-toggle.visible {
      display: flex;
    }

    #shop-toggle:hover {
      background: #ffe994;
    }

    #sell-toggle {
      position: absolute;
      top: calc(50% + 68px);
      left: 10px;
      z-index: 7;
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      min-height: 50px;
      transform: translateY(-50%);
      border: 3px solid #19351f;
      padding: 10px 14px 8px;
      background: #9ed36a;
      color: #20321f;
      font: inherit;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 4px 4px 0 rgba(20, 33, 24, 0.72);
    }

    #sell-toggle.visible {
      display: flex;
    }

    #sell-toggle:hover {
      background: #c8ed8b;
    }

    #utility-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      padding: 0 8px;
    }

    .utility-wallet {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      margin-right: 14px;
      border: 3px solid #1b1b1b;
      padding: 6px 12px;
      background: #777777;
      box-shadow: inset 2px 2px 0 #a1a1a1, inset -2px -2px 0 #4b4b4b;
      color: #fff2a8;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .utility-wallet .coin-small {
      width: 24px;
      height: 24px;
      flex-basis: 24px;
    }

    #utility-notice {
      min-height: 24px;
      margin: -10px auto 16px;
      border: 2px solid transparent;
      padding: 7px 12px;
      color: #d9dfc7;
      font-size: 16px;
      line-height: 1.35;
      opacity: 0;
      text-align: center;
      transition: opacity 160ms ease;
    }

    #utility-notice.visible {
      opacity: 1;
      border-color: #6e8050;
      background: rgba(42, 64, 43, 0.86);
    }

    #utility-notice.success {
      border-color: #a6ce67;
      color: #efffc8;
    }

    #utility-notice.error {
      border-color: #d27a68;
      background: rgba(91, 47, 42, 0.9);
      color: #ffd5c7;
    }

    #utility-panel.shop-screen #utility-notice {
      max-width: 1100px;
      margin: -8px auto 20px;
    }

    #pause-menu {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      background: rgba(13, 22, 15, 0.78);
    }

    #pause-menu.visible {
      display: grid;
    }

    .pause-card {
      display: grid;
      width: min(420px, calc(100vw - 40px));
      gap: 14px;
      border: 5px solid #b0a77c;
      padding: 28px 30px 30px;
      background: #3c3c3c;
      box-shadow: inset 0 0 0 4px #191919, 0 8px 0 #151515;
      text-align: center;
    }

    .pause-title {
      margin: 0 0 8px;
      color: #fff2a8;
      font-size: 30px;
    }

    .pause-button {
      min-height: 50px;
      border: 3px solid #19351f;
      padding: 10px 16px 8px;
      background: var(--accent);
      color: #20321f;
      font: inherit;
      font-size: 19px;
      cursor: pointer;
    }

    .pause-button:hover {
      background: #ffe994;
    }

    .pause-button.secondary {
      background: #9ed36a;
    }

    .pause-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #utility-title {
      color: var(--ink);
      font-size: 32px;
    }

    #utility-close {
      border: 2px solid #1b1b1b;
      width: 44px;
      height: 42px;
      padding: 0;
      background: #696969;
      color: #ffffff;
      font: inherit;
      font-size: 28px;
      line-height: 34px;
      cursor: pointer;
    }

    #utility-close:hover {
      background: #8a8a8a;
    }

    #inventory-view,
    #shop-view,
    #sell-view {

</head>
<body>
  <main id="game-shell">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-splash" aria-label="Unity">
      <div class="unity-splash-content">
        <div class="unity-mark" aria-hidden="true"></div>

        </div>
      </div>
      <div class="menu-card">

    <section id="world-select" aria-label="选择世界">

          <div class="world-select-title">选择世界</div>
          <div class="world-select-subtitle">进入已有存档，或创建一个新的世界。</div>
          <div id="world-list"></div>
          <div id="world-empty-notice" role="status" aria-live="polite">暂无存档，请创建一个新世界。</div>
          <div class="world-select-actions">
            <button id="create-world" class="world-action-button" type="button">创建新世界</button>
            <button id="back-title" class="world-action-button secondary" type="button">返回</button>
          </div>
          <div id="world-select-notice" role="status" aria-live="polite"></div>
        </div>
        <div id="world-create-view">
          <div class="world-select-title">创建新世界</div>
          <div class="world-select-subtitle">为这个世界设置名称和种子。</div>
          <label class="world-field">世界名称<input id="world-name" type="text" maxlength="20" value="新世界"></label>
          <label class="world-field">世界种子<input id="world-seed" type="text" inputmode="numeric" placeholder="留空则随机生成"></label>
          <div class="world-select-actions">
            <button id="confirm-create-world" class="world-action-button" type="button">创建并进入</button>
            <button id="cancel-create-world" class="world-action-button secondary" type="button">返回</button>

          <div id="world-create-notice" role="status" aria-live="polite"></div>

    </section>

    <section id="loading" aria-live="polite">
      <div class="loading-title">载入海面</div>
      <div class="track"><div id="progress"></div></div>
      <div id="status">准备中…</div>
    </section>

    <div id="coin-display" aria-live="polite"><span class="coin-sprite"></span><span class="coin-separator">:</span><span id="coin-amount">100</span></div>
    <div id="persistent-hotbar" aria-label="快捷栏"></div>
    <button id="shop-toggle" type="button" aria-label="打开商店">商店</button>
    <button id="sell-toggle" type="button" aria-label="打开出售界面">出售</button>
    <div id="hotkey-hud">WASD 移动玩家 · 木筏随海流漂移 · 左键发射钩子</div>
    <div id="hotkey-feedback" aria-live="polite"></div>
    <section id="utility-panel" aria-label="背包和商店">
      <div id="utility-title-row">
        <div id="utility-title">背包</div>
        <div class="utility-wallet" aria-live="polite"><span class="coin-sprite coin-small"></span><span>金币</span><span id="utility-coin-amount">0</span></div>
        <button id="utility-close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="utility-notice" role="status" aria-live="polite"></div>
      <div id="inventory-view">
        <div class="inventory-grid" id="inventory-grid"></div>
        <div class="hotbar-label">快捷栏</div>
        <div class="hotbar-grid" id="hotbar-grid"></div>
        <div class="inventory-tip">按 E 或 Esc 关闭 · 数字键 1–9 选择快捷栏</div>
      </div>
      <div id="shop-view">
        <div class="shop-intro">购买店铺经营所需的物品。</div>
        <div class="shop-grid">
          <button class="shop-button" data-item="wheat_seed" data-price="5" data-label="小麦种子">
            <span class="shop-icon sprite-r0-c0"></span><span class="shop-copy"><strong>小麦种子</strong><small>经营商品 · <span class="price"><span class="coin-sprite coin-small"></span>5</span></small></span>
          </button>
          <button class="shop-button" data-item="carrot_seed" data-price="8" data-label="胡萝卜种子">
            <span class="shop-icon sprite-r0-c1"></span><span class="shop-copy"><strong>胡萝卜种子</strong><small>经营商品 · <span class="price"><span class="coin-sprite coin-small"></span>8</span></small></span>
          </button>
          <button class="shop-button" data-item="fertilizer" data-price="12" data-label="肥料">
            <span class="shop-icon sprite-r0-c2"></span><span class="shop-copy"><strong>肥料</strong><small>经营商品 · <span class="price"><span class="coin-sprite coin-small"></span>12</span></small></span>
          </button>
          <button class="shop-button" data-item="wood" data-price="15" data-label="木材">
            <span class="shop-icon sprite-r0-c3"></span><span class="shop-copy"><strong>木材</strong><small>经营商品 · <span class="price"><span class="coin-sprite coin-small"></span>15</span></small></span>
          </button>
          <button class="shop-button" data-item="wood_sword" data-price="30" data-label="木剑">
            <span class="shop-icon sprite-r3-c0"></span><span class="shop-copy"><strong>木剑</strong><small>经营商品 · <span class="price"><span class="coin-sprite coin-small"></span>30</span></small></span>
          </button>
        </div>
      </div>
      <div id="sell-view">
        <div class="shop-intro">出售背包里的商品，换取金币。</div>
        <div class="shop-section-title">出售商品</div>
        <div class="shop-grid">
          <button class="shop-button" data-sell-item="wheat_crop" data-price="10" data-label="小麦">
            <span class="shop-icon sprite-r2-c0"></span><span class="shop-copy"><strong>出售小麦</strong><small>每份获得 <span class="price"><span class="coin-sprite coin-small"></span>10</span></small></span>
          </button>
          <button class="shop-button" data-sell-item="carrot_crop" data-price="16" data-label="胡萝卜">
            <span class="shop-icon sprite-r2-c1"></span><span class="shop-copy"><strong>出售胡萝卜</strong><small>每份获得 <span class="price"><span class="coin-sprite coin-small"></span>16</span></small></span>
          </button>

      </div>
    </section>
    <section id="pause-menu" aria-label="游戏菜单">
      <div class="pause-card">

    <div id="banner" role="alert"></div>

  <script>
    const gameShell = document.querySelector("#game-shell");
    const canvas = document.querySelector("#unity-canvas");
    const menu = document.querySelector("#menu");
    const startGame = document.querySelector("#start-game");
    const worldSelect = document.querySelector("#world-select");
    const worldListView = document.querySelector("#world-list-view");
    const worldCreateView = document.querySelector("#world-create-view");
    const worldList = document.querySelector("#world-list");
    const worldEmptyNotice = document.querySelector("#world-empty-notice");
    const createWorld = document.querySelector("#create-world");
    const backTitle = document.querySelector("#back-title");
    const worldSelectNotice = document.querySelector("#world-select-notice");
    const worldName = document.querySelector("#world-name");
    const worldSeed = document.querySelector("#world-seed");
    const confirmCreateWorld = document.querySelector("#confirm-create-world");
    const cancelCreateWorld = document.querySelector("#cancel-create-world");
    const worldCreateNotice = document.querySelector("#world-create-notice");
    const pauseMenu = document.querySelector("#pause-menu");
    const resumeGame = document.querySelector("#resume-game");
    const saveExitGame = document.querySelector("#save-exit-game");
    const loading = document.querySelector("#loading");
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const banner = document.querySelector("#banner");
    const coinDisplay = document.querySelector("#coin-display");
    const coinAmountLabel = document.querySelector("#coin-amount");
    const persistentHotbar = document.querySelector("#persistent-hotbar");
    const shopToggle = document.querySelector("#shop-toggle");
    const sellToggle = document.querySelector("#sell-toggle");
    const hotkeyHud = document.querySelector("#hotkey-hud");
    const hotkeyFeedback = document.querySelector("#hotkey-feedback");
    const utilityPanel = document.querySelector("#utility-panel");
    const utilityTitle = document.querySelector("#utility-title");
    const utilityCoinAmount = document.querySelector("#utility-coin-amount");
    const utilityNotice = document.querySelector("#utility-notice");
    const utilityClose = document.querySelector("#utility-close");
    const inventoryView = document.querySelector("#inventory-view");
    const inventoryGrid = document.querySelector("#inventory-grid");
    const hotbarGrid = document.querySelector("#hotbar-grid");
    const shopView = document.querySelector("#shop-view");
    const sellView = document.querySelector("#sell-view");
    let utilityMode = null;
    let gamePaused = false;
    let selectedHotbarIndex = 0;
    let coinAmount = 100;
    const inventorySlots = Array(27).fill(null);
    const hotbarSlots = Array(9).fill(null);
    const saveStoragePrefix = "zhongzhijianzao-save-";
    const legacySaveStorageKey = "zhongzhijianzao-save-v1";
    let activeSaveSlot = "world-1";
    let pendingCreateSlot = null;
    let selectedWorldSeed = 271828;
    let selectedWorldName = "世界 1";
    const shopInventory = {
      wheat_seed: 0,
      carrot_seed: 0,
      fertilizer: 0,
      wood: 0,
      watering_can: 0,
      hoe: 0,
      wood_sword: 0,
      wheat_crop: 0,
      carrot_crop: 0
    };
    let hotkeyFeedbackTimer;
    let utilityNoticeTimer;

    const worldSlots = [
      { id: "world-1", label: "世界 1" },
      { id: "world-2", label: "世界 2" },
      { id: "world-3", label: "世界 3" }
    ];

    function saveStorageKeyFor(slotId) {
      return saveStoragePrefix + slotId;
    }

    function worldMetaKey(slotId) {
      return saveStoragePrefix + slotId + "-meta";
    }

    function readWorldMeta(slotId) {
      try {
        const raw = localStorage.getItem(worldMetaKey(slotId));
        const meta = raw ? JSON.parse(raw) : {};
        const parsedSeed = Number(meta.seed);
        return {
          name: String(meta.name || (worldSlots.find(slot => slot.id === slotId) || {}).label || slotId),
          seed: Number.isFinite(parsedSeed) && parsedSeed !== 0 ? Math.abs(Math.trunc(parsedSeed)) : 271828
        };
      } catch (error) {
        return { name: String((worldSlots.find(slot => slot.id === slotId) || {}).label || slotId), seed: 271828 };
      }
    }

    function saveWorldMeta(slotId, meta) {
      try {
        localStorage.setItem(worldMetaKey(slotId), JSON.stringify(meta));
      } catch (error) {
        // 浏览器禁用本地存储时，仍允许创建临时世界。
      }
    }

    function generateWorldSeed() {
      return Math.floor(Math.random() * 2147483646) + 1;
    }

    function parseWorldSeed(raw) {
      const trimmed = String(raw || "").trim();
      if (!trimmed) return generateWorldSeed();
      if (!/^[+-]?\d+$/.test(trimmed)) return null;
      const parsed = Number.parseInt(trimmed, 10);
      if (!Number.isFinite(parsed) || parsed === 0) return null;
      return Math.abs(parsed) % 2147483647 || 1;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function readWorldSave(slotId) {
      try {
        return localStorage.getItem(saveStorageKeyFor(slotId));
      } catch (error) {
        return null;
      }
    }

    function migrateLegacySave() {
      try {
        if (!localStorage.getItem(saveStorageKeyFor("world-1")) &&
            localStorage.getItem(legacySaveStorageKey)) {
          localStorage.setItem(
            saveStorageKeyFor("world-1"),
            localStorage.getItem(legacySaveStorageKey));
          saveWorldMeta("world-1", { name: "世界 1", seed: 271828 });
        }
      } catch (error) {
        // 浏览器禁用本地存储时，仍允许创建临时世界。
      }
    }

    function showWorldSelectNotice(message) {
      worldSelectNotice.textContent = message || "";
    }

    function refreshWorldList() {
      migrateLegacySave();
      const savedSlots = worldSlots.filter(slot => Boolean(readWorldSave(slot.id)));
      worldEmptyNotice.classList.toggle("visible", savedSlots.length === 0);
      worldList.innerHTML = savedSlots.map(slot => {
        const meta = readWorldMeta(slot.id);
        return "<div class=\"world-card has-save\">" +
          "<div class=\"world-card-copy\"><strong>" + escapeHtml(meta.name) + "</strong>" +
          "<small>已有存档 · 种子 " + meta.seed + "</small></div>" +
          "<div class=\"world-card-actions\">" +
          "<button class=\"world-card-button\" type=\"button\" data-world-slot=\"" + slot.id +
          "\" data-world-action=\"enter\">进入世界</button>" +
          "<button class=\"world-card-button delete\" type=\"button\" data-world-slot=\"" + slot.id +
          "\" data-world-action=\"delete\">删除</button></div></div>";
      }).join("");

      worldList.querySelectorAll("[data-world-slot]").forEach(button => {
        button.addEventListener("click", () => {
          if (button.dataset.worldAction === "delete") {
            deleteWorld(button.dataset.worldSlot);
            return;
          }
          startWorld(button.dataset.worldSlot, false);
        });
      });
    }

    function deleteWorld(slotId) {
      const meta = readWorldMeta(slotId);
      if (!window.confirm("确定删除存档“" + meta.name + "”吗？此操作不可恢复。")) {
        return;
      }
      try {
        localStorage.removeItem(saveStorageKeyFor(slotId));
        localStorage.removeItem(worldMetaKey(slotId));
        if (slotId === "world-1") {
          localStorage.removeItem(legacySaveStorageKey);
        }
      } catch (error) {
        showWorldSelectNotice("删除失败，请检查浏览器存储权限。");
        return;
      }
      refreshWorldList();
      showWorldSelectNotice("已删除存档“" + meta.name + "”。");
    }

    function showCreateWorld(slotId) {
      const emptySlot = slotId ? worldSlots.find(slot => slot.id === slotId && !readWorldSave(slot.id)) : worldSlots.find(slot => !readWorldSave(slot.id));
      if (!emptySlot) {
        showWorldSelectNotice("存档位置已满，请进入已有世界。");
        return;
      }
      pendingCreateSlot = emptySlot.id;
      worldName.value = "新世界";
      worldSeed.value = "";
      worldCreateNotice.textContent = "";
      worldListView.style.display = "none";
      worldCreateView.classList.add("visible");
      worldName.focus();
    }

    function hideCreateWorld() {
      pendingCreateSlot = null;
      worldCreateView.classList.remove("visible");
      worldListView.style.display = "grid";
      worldCreateNotice.textContent = "";
    }

    function startWorld(slotId, resetSave, metadata) {
      const meta = metadata || readWorldMeta(slotId);
      activeSaveSlot = slotId;
      selectedWorldSeed = meta.seed;
      selectedWorldName = meta.name;
      if (resetSave) {
        try {
          localStorage.removeItem(saveStorageKeyFor(slotId));
        } catch (error) {
          // Ignore storage errors and start a temporary world.
        }
        saveWorldMeta(slotId, meta);
      }
      showWorldSelectNotice("");
      hideCreateWorld();
      worldSelect.classList.remove("visible");
      menu.classList.add("hidden");
      bootGame();
    }

    function showWorldSelect() {
      hideCreateWorld();
      refreshWorldList();
      showWorldSelectNotice("");
      menu.classList.add("hidden");
      worldSelect.classList.add("visible");
    }

    window.GetSelectedWorldSeed = () => selectedWorldSeed;

    window.SaveGameData = json => {
      try {
        localStorage.setItem(saveStorageKeyFor(activeSaveSlot), json || "");
      } catch (error) {
        // 浏览器禁用本地存储时，游戏仍可继续运行。
      }
    };

    window.LoadGameData = () => {
      try {
        migrateLegacySave();
        return localStorage.getItem(saveStorageKeyFor(activeSaveSlot)) || "";
      } catch (error) {
        return "";
      }
    };

    function showHotkeyFeedback(message) {
      if (utilityMode === "shop" || utilityMode === "sell") {
        showUtilityNotice(message);
      }
    }

    function showUtilityNotice(message, kind = "info") {
      utilityNotice.textContent = message;
      utilityNotice.className = "visible " + kind;
      clearTimeout(utilityNoticeTimer);
      utilityNoticeTimer = setTimeout(() => {
        utilityNotice.className = "";
      }, 1800);
    }

    window.setCoinDisplay = value => {
      const amount = Number(value);
      coinAmount = Number.isFinite(amount) ? amount : 0;
      coinAmountLabel.textContent = coinAmount.toLocaleString("zh-CN");
      utilityCoinAmount.textContent = coinAmount.toLocaleString("zh-CN");
      if (gameReady) coinDisplay.classList.add("visible");
      updateInventory();
    };

    window.setShopItemCount = (itemId, count) => {
      if (Object.prototype.hasOwnProperty.call(shopInventory, itemId)) {
        shopInventory[itemId] = Math.max(0, Number(count) || 0);
        EnsureItemPlacement(itemId);
        updateInventory();
      }
    };

    window.notifyFarmingFeedback = message => showHotkeyFeedback(message);
    window.notifyHarvest = (itemId, count) => {
      if (Object.prototype.hasOwnProperty.call(shopInventory, itemId)) {
        shopInventory[itemId] = Math.max(0, Number(count) || 0);
        EnsureItemPlacement(itemId);
        updateInventory();
      }
      const label = itemId === "carrot_crop" ? "胡萝卜" : "小麦";
      showHotkeyFeedback("获得" + label + "，请到商店出售");
    };

    function updateInventory() {
      inventoryGrid.innerHTML = inventorySlots
        .map((itemId, index) => renderInventorySlot(itemId, "inventory", index))
        .join("");
      const hotbarMarkup = hotbarSlots
        .map((itemId, index) => renderInventorySlot(itemId, "hotbar", index))
        .join("");
      hotbarGrid.innerHTML = hotbarMarkup;
      persistentHotbar.innerHTML = hotbarMarkup;
      bindInventoryDrag();
    }

    function renderInventorySlot(itemId, slotType, slotIndex) {
      const count = itemId && shopInventory[itemId] ? shopInventory[itemId] : 0;
      const filled = itemId && count > 0;
      const sprite = itemId ? getItemSprite(itemId) : "";
      const selected = slotType === "hotbar" && slotIndex === selectedHotbarIndex;
      const countMarkup = filled && !isNonStackable(itemId)
        ? "<span class=\"slot-count\">" + count + "</span>"
        : "";
      return "<div class=\"inventory-slot" + (filled ? " filled" : "") +
        (selected ? " selected" : "") + "\" data-slot-type=\"" + slotType +
        "\" data-slot-index=\"" + slotIndex + "\" draggable=\"" +
        (filled ? "true" : "false") + "\">" +
        (filled
          ? "<span class=\"slot-icon " + sprite + "\"></span>" + countMarkup
          : "") +
        "</div>";
    }

    function getItemSprite(itemId) {
      const sprites = {
        wheat_seed: "sprite-r0-c0",
        carrot_seed: "sprite-r0-c1",
        fertilizer: "sprite-r0-c2",
        wood: "sprite-r0-c3",
        watering_can: "sprite-r0-c4",
        hoe: "sprite-r0-c5",
        wood_sword: "sprite-r3-c0",
        wood_pickaxe: "sprite-r3-c5",
        stone_pickaxe: "sprite-r3-c6",
        wheat_crop: "sprite-r2-c0",
        carrot_crop: "sprite-r2-c1"
      };
      return sprites[itemId] || "";
    }

    function isNonStackable(itemId) {
      return itemId === "hoe" || itemId === "watering_can" || itemId === "wood_sword";
    }

    function EnsureItemPlacement(itemId) {
      if (!itemId) {
        return;
      }

      const hotbarIndex = hotbarSlots.indexOf(itemId);
      const inventoryIndex = inventorySlots.indexOf(itemId);
      const count = shopInventory[itemId] || 0;
      if (count <= 0) {
        if (hotbarIndex >= 0) hotbarSlots[hotbarIndex] = null;
        if (inventoryIndex >= 0) inventorySlots[inventoryIndex] = null;
        return;
      }

      if (hotbarIndex >= 0 || inventoryIndex >= 0) {
        return;
      }

      const hotbarEmptyIndex = hotbarSlots.indexOf(null);
      if (hotbarEmptyIndex >= 0) {
        hotbarSlots[hotbarEmptyIndex] = itemId;
        return;
      }

      const inventoryEmptyIndex = inventorySlots.indexOf(null);
      if (inventoryEmptyIndex >= 0) {
        inventorySlots[inventoryEmptyIndex] = itemId;
      }
    }

    let draggedSlot = null;

    function bindInventoryDrag() {
      document.querySelectorAll("#inventory-view .inventory-slot, #persistent-hotbar .inventory-slot").forEach(slot => {
        slot.addEventListener("dragstart", event => {
          if (slot.dataset.draggable !== "true" && slot.getAttribute("draggable") !== "true") {
            event.preventDefault();
            return;
          }
          draggedSlot = {
            type: slot.dataset.slotType,
            index: Number(slot.dataset.slotIndex)
          };
          slot.classList.add("dragging");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", "inventory-item");
          }
        });
        slot.addEventListener("dragend", () => {
          slot.classList.remove("dragging");
          draggedSlot = null;
        });
        slot.addEventListener("click", () => {
          if (slot.dataset.slotType !== "hotbar") return;
          selectedHotbarIndex = Number(slot.dataset.slotIndex);
          updateInventory();
          sendSelectedHotbarItem();
        });
        slot.addEventListener("dragover", event => event.preventDefault());
        slot.addEventListener("drop", event => {
          event.preventDefault();
          if (!draggedSlot) return;
          const target = {
            type: slot.dataset.slotType,
            index: Number(slot.dataset.slotIndex)
          };
          const sourceSlots = draggedSlot.type === "hotbar" ? hotbarSlots : inventorySlots;
          const targetSlots = target.type === "hotbar" ? hotbarSlots : inventorySlots;
          const sourceItem = sourceSlots[draggedSlot.index];
          if (!sourceItem) return;
          const targetItem = targetSlots[target.index];
          targetSlots[target.index] = sourceItem;
          sourceSlots[draggedSlot.index] = targetItem || null;
          if (target.type === "hotbar") {
            selectedHotbarIndex = target.index;
          }
          updateInventory();
          sendSelectedHotbarItem();
        });
      });
    }

    function sendSelectedHotbarItem() {
      const itemId = hotbarSlots[selectedHotbarIndex];
      if (unityInstance) {
        unityInstance.SendMessage("Prototype Bootstrap", "SelectHotbarItem", itemId || "");
      }
    }

    function openUtility(mode) {
      utilityMode = mode;
      const isShop = mode === "shop";
      const isSell = mode === "sell";
      const isFullScreen = isShop || isSell;
      utilityTitle.textContent = isShop ? "商店" : isSell ? "出售" : "背包";
      inventoryView.style.display = isFullScreen ? "none" : "block";
      shopView.classList.toggle("visible", isShop);
      sellView.classList.toggle("visible", isSell);
      updateInventory();
      setGameInputLocked(true);

      if (isFullScreen) {
        utilityPanel.classList.add("shop-screen");
        utilityPanel.classList.remove("visible");
        requestAnimationFrame(() => utilityPanel.classList.add("visible"));
      } else {
        utilityPanel.classList.remove("shop-screen");
        utilityPanel.classList.add("visible");
      }
    }

    function closeUtility() {
      const isFullScreen = utilityPanel.classList.contains("shop-screen");
      utilityPanel.classList.remove("visible");
      utilityMode = null;
      if (isFullScreen) {
        window.setTimeout(() => {
          utilityPanel.classList.remove("shop-screen");
          setGameInputLocked(false);
        }, 380);
      } else {
        setGameInputLocked(false);
      }
    }

    function setGameInputLocked(locked) {
      if (unityInstance) {
        unityInstance.SendMessage("Player", "SetInputLocked", locked ? "true" : "false");
      }
      if (locked) {
        canvas.blur();
      } else {
        canvas.focus();
      }
    }

    function openPauseMenu() {
      if (!gameReady || utilityMode || gamePaused) return;
      gamePaused = true;
      pauseMenu.classList.add("visible");
      setGameInputLocked(true);
    }

    function closePauseMenu() {
      if (!gamePaused) return;
      gamePaused = false;
      pauseMenu.classList.remove("visible");
      setGameInputLocked(false);
    }

    function saveAndExitGame() {
      saveExitGame.disabled = true;
      saveExitGame.textContent = "正在保存…";
      if (unityInstance) {
        unityInstance.SendMessage("Prototype Bootstrap", "SaveGameNow");
      }
      window.setTimeout(() => window.location.reload(), 120);
    }

    utilityClose.addEventListener("click", closeUtility);
    shopToggle.addEventListener("click", () => openUtility("shop"));
    sellToggle.addEventListener("click", () => openUtility("sell"));
    resumeGame.addEventListener("click", closePauseMenu);
    saveExitGame.addEventListener("click", saveAndExitGame);
    createWorld.addEventListener("click", () => showCreateWorld());
    cancelCreateWorld.addEventListener("click", hideCreateWorld);
    confirmCreateWorld.addEventListener("click", () => {
      if (!pendingCreateSlot) {
        showCreateWorld();
        return;
      }
      const name = (worldName.value || "新世界").trim().slice(0, 20) || "新世界";
      const seed = parseWorldSeed(worldSeed.value);
      if (seed === null) {
        worldCreateNotice.textContent = "种子只能填写数字，或留空随机生成。";
        worldSeed.focus();
        return;
      }
      const metadata = { name, seed };
      saveWorldMeta(pendingCreateSlot, metadata);
      startWorld(pendingCreateSlot, true, metadata);
    });
    backTitle.addEventListener("click", () => {
      if (worldCreateView.classList.contains("visible")) {
        hideCreateWorld();
        return;
      }
      worldSelect.classList.remove("visible");
      menu.classList.remove("hidden");
      showWorldSelectNotice("");
    });

    document.querySelectorAll("[data-item]").forEach(button => {
      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        if (button.dataset.busy === "true") return;
        button.dataset.busy = "true";
        window.setTimeout(() => { delete button.dataset.busy; }, 250);
        if (!unityInstance) {
          showHotkeyFeedback("世界还在载入");
          return;
        }

        const id = button.dataset.item;
        const price = Number(button.dataset.price);
        const label = button.dataset.label;
        if (coinAmount < price) {
          showUtilityNotice("金币不足，无法购买" + label, "error");
          return;
        }
        if (isNonStackable(id) && (shopInventory[id] || 0) > 0) {
          showUtilityNotice("你已经拥有" + label, "error");
          return;
        }

        unityInstance.SendMessage("Prototype Bootstrap", "BuyItem", id);
        openUtility("shop");
        showUtilityNotice("已购买" + label, "success");
      });
    });

    document.querySelectorAll("[data-sell-item]").forEach(button => {
      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        if (button.dataset.busy === "true") return;
        button.dataset.busy = "true";
        window.setTimeout(() => { delete button.dataset.busy; }, 250);
        if (!unityInstance) {
          showHotkeyFeedback("世界还在载入");
          return;
        }

        const id = button.dataset.sellItem;
        const price = Number(button.dataset.price);
        const label = button.dataset.label;
        if ((shopInventory[id] || 0) <= 0) {
          showUtilityNotice("背包里没有可出售的" + label, "error");
          return;
        }

        unityInstance.SendMessage("Prototype Bootstrap", "SellItem", id);
        openUtility("sell");
        showUtilityNotice("已出售" + label + "，获得" + price + "金币", "success");
      });
    });

    // 每次发布都更换版本号，避免 UnityCache/浏览器继续使用旧的同名构建文件。
    const buildUrl = "Build";
    const buildVersion = "20260726-raft1";
    const assetUrl = file => buildUrl + "/" + file + "?v=" + buildVersion;
    const loaderUrl = assetUrl("{{{ LOADER_FILENAME }}}");
    const config = {
      arguments: [],
      dataUrl: assetUrl("{{{ DATA_FILENAME }}}"),
      frameworkUrl: assetUrl("{{{ FRAMEWORK_FILENAME }}}"),
      codeUrl: assetUrl("{{{ CODE_FILENAME }}}"),
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner(message, type) {
        banner.textContent = message;
        banner.style.display = "block";
        if (type !== "error") setTimeout(() => banner.style.display = "none", 5000);
      }
    };

    let unityInstance;
    let bootStarted = false;
    let gameReady = false;

    function bootGame() {
      if (bootStarted) return;
      bootStarted = true;
      loading.classList.add("active");

      const loader = document.createElement("script");
      loader.src = loaderUrl;
      loader.onload = () => {
        createUnityInstance(canvas, config, value => {
          const percent = Math.round(value * 100);
          progress.style.width = percent + "%";
          status.textContent = "载入 " + percent + "%";
        }).then(instance => {
          unityInstance = instance;
          gameReady = true;
          loading.classList.add("done");
          coinDisplay.classList.remove("visible");
          persistentHotbar.classList.remove("visible");
          shopToggle.classList.remove("visible");
          sellToggle.classList.remove("visible");
          hotkeyHud.textContent = "WASD 移动玩家 · 木筏随海流漂移 · 左键发射钩子";
          hotkeyHud.classList.add("visible");
          canvas.focus();
        }).catch(message => {
          banner.textContent = message;
          banner.style.display = "block";
          status.textContent = "载入失败";
        });
      };
      loader.onerror = () => {
        banner.textContent = "载入失败，请刷新重试";
        banner.style.display = "block";
        status.textContent = "载入失败";
      };
      document.body.appendChild(loader);
    }

    startGame.addEventListener("click", () => {
      showWorldSelect();
    });

    window.addEventListener("beforeunload", () => {
      if (unityInstance) {
        unityInstance.SendMessage("Prototype Bootstrap", "SaveGameNow");
      }
    });

    document.addEventListener("keydown", event => {
      if (!menu.classList.contains("hidden")) return;
      if (!gameReady) {
        event.preventDefault();
        return;
      }
      const key = event.key.toLowerCase();
      if (gamePaused) {
        event.preventDefault();
        if (event.key === "Escape") closePauseMenu();
        return;
      }
      if (utilityMode && key !== "e" && event.key !== "Escape") {
        event.preventDefault();
        event.stopImmediatePropagation();
        return;
      }
      if (key === "e") {
        event.preventDefault();
      }
      if (/^[1-9]$/.test(key)) {
        selectedHotbarIndex = Number(key) - 1;
        updateInventory();
        sendSelectedHotbarItem();
      }
      if (event.key === "Escape") {
        event.preventDefault();
        utilityMode ? closeUtility() : openPauseMenu();
      }
    }, true);

    canvas.addEventListener("pointerdown", () => {
      if (!utilityMode) canvas.focus();
    });
    canvas.addEventListener("contextmenu", event => {
      event.preventDefault();
      if (gameReady && !utilityMode && menu.classList.contains("hidden")) showHotkeyFeedback("左键发射钩子，右键无操作");
    });
  </script>
</body>
</html>
